<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="SSTool monogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070708"/>
      <stop offset="1" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a9aa1"/>
      <stop offset="0.3" stop-color="#f4f4f6"/>
      <stop offset="0.55" stop-color="#c4c4ca"/>
      <stop offset="0.8" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8b8b92"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <rect width="200" height="200" fill="url(#grid)"/>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <rect x="17" y="17" width="166" height="166" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <g stroke="#d9d9dd" stroke-opacity="0.6" stroke-width="1.2" fill="none">
    <path d="M10 30V10h20"/>
    <path d="M190 30V10h-20"/>
    <path d="M10 170v20h20"/>
    <path d="M190 170v20h-20"/>
  </g>

  <text x="102" y="114" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.12" filter="url(#softGlow)">SS</text>
  <text x="100" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="2" fill="url(#silver)">SS</text>

  <path d="M58 132h84" stroke="url(#rule)" stroke-width="1"/>
  <path d="M100 126l5 6-5 6-5-6z" fill="#d9d9dd" opacity="0.85"/>

  <text x="100" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="4" fill="#b9b9bf">SSTOOL</text>
  <text x="100" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="700" letter-spacing="1.8" fill="#6f6f76">DIGITAL FORENSICS SUITE</text>
</svg>
